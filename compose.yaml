# Deployment model: nginx runs on the HOST (see deploy/README.md) and proxies to
# 127.0.0.1:8020, which is the Next.js front door (`next`). Next renders the pages it owns and
# proxies every other path to FastAPI (`web`, internal port 8000; also on 127.0.0.1:8021 for the
# operator and for rollback).
# The visitor's address: nginx sets X-Forwarded-For and a secret header (X-Edge-Secret) on every
# request, `next` passes both on unchanged, and FastAPI believes the forwarded address only on a
# request that carries the secret (EDGE_SHARED_SECRET in .env, app/edge.py). It is NOT decided by
# the peer address: Docker rewrites any container's (and the host loopback's) connection to the
# bridge gateway, so the peer cannot tell nginx from a hostile container. uvicorn therefore runs
# with --no-proxy-headers and never rewrites the peer itself. `front` holds only `next` (at a fixed
# address) and `web`; it is not a security boundary. See
# docs/sop/2026-11-03-edge-secret-and-login-limits.md.
# The server is shared with other apps, so nothing here is published on a public interface: `next`
# and `web` are bound to 127.0.0.1.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: notetaker
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [appdb]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notetaker"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    networks: [appdb]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    user: app
    networks: [default, appdb]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
    volumes:
      - audiodata:/srv/data/audio
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Everything time-critical (spec section 9.7), in its own process so a long transcription in
  # `worker` can never delay it. One replica leads through a Postgres advisory lock; nothing
  # depends on this service, so one that cannot start never takes `web` or `next` down. It
  # needs no setting of its own (DATABASE_URL and .env as `worker`).
  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    user: app
    networks: [default, appdb]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
    mem_limit: 256m
    restart: unless-stopped
    # A dispatch tick starts no row after RUN_BUDGET_SECONDS (20), and a row started just inside
    # that can still do a calendar re-check (about 20), a send (30) and a stop (30): the grace
    # must be longer, or a kill between the provider taking a bot and the commit leaves an orphan.
    stop_grace_period: 120s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --no-proxy-headers  # the app decides which X-Forwarded-For to believe (app/edge.py)
    user: app
    networks: [default, appdb, front]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
    ports:
      - "127.0.0.1:8021:8000"  # operator and rollback access; visitors reach FastAPI through `next`
    # The notes export (WeasyPrint, in a child process) adds about 100 MiB while it runs on top of
    # the app's own ~90 MiB (docs/spike/export-pdf-memory.md); this keeps a runaway from taking the
    # shared server's memory. `next` has 512m.
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The front door (see docs/superpowers/specs/2026-11-02-nextjs-migration-plan.md). Renders the
  # pages Next owns and proxies every other path to FastAPI. It holds no secrets and no env_file.
  # FASTAPI_INTERNAL_URL is baked into the image at build time (Next stores rewrites in its build
  # output), so it is a build argument; the environment entry below only documents it at runtime.
  next:
    build:
      context: ./web
      args:
        FASTAPI_INTERNAL_URL: http://web:8000
    environment:
      FASTAPI_INTERNAL_URL: http://web:8000
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-7}  # shown on /privacy; keep equal to the app's
    networks:
      front:
        ipv4_address: 172.28.1.10
    ports:
      - "127.0.0.1:8020:3000"
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

# Three networks: `default` carries web, worker and scheduler and has internet access (Skribby is
# reached over it); `appdb` (no internet) holds the app database; `front` holds only `next` and
# `web`, with `next` at the fixed address 172.28.1.10. `front` is NOT a security boundary: Docker
# still lets other containers reach `next`'s published port by IP.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  front:
    ipam:
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1
  appdb:
    internal: true

volumes:
  dbdata:
  audiodata:
