# Deployment model: nginx runs on the HOST (see deploy/README.md) and proxies to
# 127.0.0.1:8000, the only published port. The project network is pinned so the address
# nginx's connections arrive from inside the container (the bridge gateway, 172.28.0.1) is
# known and can be the one trusted proxy. Vexa also runs on the host (port 8056) and is
# reached as host.docker.internal.
# TRUSTED_PROXY_IPS: unset means the bridge gateway above; set but EMPTY means trust no proxy
# (`-` interpolation, not `:-`, so an empty value is kept rather than replaced by the default).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: notetaker
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notetaker"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    user: app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
      # Vexa runs on the host, not in this compose project.
      VEXA_BASE_URL: http://host.docker.internal:8056
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audiodata:/srv/data/audio
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=${TRUSTED_PROXY_IPS-172.28.0.1}
    user: app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
      VEXA_BASE_URL: http://host.docker.internal:8056
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  dbdata:
  audiodata:
