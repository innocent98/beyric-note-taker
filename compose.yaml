# Deployment model: nginx runs on the HOST (see deploy/README.md) and proxies to
# 127.0.0.1:8020, which is the Next.js front door (`next`). Next renders the pages it owns and
# proxies every other path to FastAPI (`web`, internal port 8000; also on 127.0.0.1:8021 for the
# operator and for rollback).
# The visitor's address: nginx sets X-Forwarded-For and a secret header (X-Edge-Secret) on every
# request, `next` passes both on unchanged, and FastAPI believes the forwarded address only on a
# request that carries the secret (EDGE_SHARED_SECRET in .env, app/edge.py). It is NOT decided by
# the peer address: Docker rewrites any container's (and the host loopback's) connection to the
# bridge gateway, so the peer cannot tell nginx from a hostile container. uvicorn therefore runs
# with --no-proxy-headers and never rewrites the peer itself. `front` only stops Vexa resolving the
# name `next`; it is not a security boundary. See docs/sop/2026-11-03-edge-secret-and-login-limits.md.
# The server is shared with other apps, so nothing here is published on a public interface: `next`,
# `web` and Vexa's API are bound to 127.0.0.1, and Vexa's terminal and agent ports are not published.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: notetaker
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [appdb]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notetaker"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    networks: [appdb]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    user: app
    networks: [default, appdb]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
      VEXA_BASE_URL: http://vexa:8056
    volumes:
      - audiodata:/srv/data/audio
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Everything time-critical (spec section 9.7), in its own process so a long transcription in
  # `worker` can never delay it. One replica leads through a Postgres advisory lock; nothing
  # depends on this service, so one that cannot start never takes `web` or `next` down. It
  # needs no setting of its own (DATABASE_URL and .env as `worker`).
  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    user: app
    networks: [default, appdb]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
      VEXA_BASE_URL: http://vexa:8056
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 40s  # lets a tick in progress finish before the lock is given up
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --no-proxy-headers  # the app decides which X-Forwarded-For to believe (app/edge.py)
    user: app
    networks: [default, appdb, front]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/notetaker
      VEXA_BASE_URL: http://vexa:8056
    ports:
      - "127.0.0.1:8021:8000"  # operator and rollback access; visitors reach FastAPI through `next`
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The front door (see docs/superpowers/specs/2026-11-02-nextjs-migration-plan.md). Renders the
  # pages Next owns and proxies every other path to FastAPI. It holds no secrets and no env_file.
  # FASTAPI_INTERNAL_URL is baked into the image at build time (Next stores rewrites in its build
  # output), so it is a build argument; the environment entry below only documents it at runtime.
  next:
    build:
      context: ./web
      args:
        FASTAPI_INTERNAL_URL: http://web:8000
    environment:
      FASTAPI_INTERNAL_URL: http://web:8000
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-7}  # shown on /privacy; keep equal to the app's
    networks:
      front:
        ipv4_address: 172.28.1.10
    ports:
      - "127.0.0.1:8020:3000"
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  # ---- Vexa Lite (bots). Same containers as Vexa's deploy/lite Makefile at commit 31122f9, run
  # here instead so no port is public, no host credentials file is ever mounted, and Vexa's own
  # database and storage get random passwords (VEXA_DB_PASSWORD, VEXA_STORAGE_SECRET in .env). ----

  vexa-db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    environment:
      POSTGRES_DB: vexa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VEXA_DB_PASSWORD:?set VEXA_DB_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - vexapgdata:/var/lib/postgresql/data
    networks: [vexainternal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vexa"]
      interval: 5s
      timeout: 3s
      retries: 20

  vexa-storage:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /srv/vexa-storage/data /srv/vexa-storage/iam && exec versitygw --port :9000 --health /health --iam-dir /srv/vexa-storage/iam --quiet posix /srv/vexa-storage/data
    environment:
      ROOT_ACCESS_KEY: vexa-access-key
      ROOT_SECRET_KEY: ${VEXA_STORAGE_SECRET:?set VEXA_STORAGE_SECRET in .env}
    volumes:
      - vexastorage:/srv/vexa-storage
    networks: [vexainternal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the recordings bucket; "already owned" on later runs counts as success.
  vexa-storage-init:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ["/bin/sh", "-c"]
    command:
      - out=$$(versitygw admin --endpoint-url http://vexa-storage:9000 create-bucket --bucket vexa --owner vexa-access-key 2>&1) || echo "$$out" | grep -q BucketAlreadyOwnedByYou || { echo "$$out"; exit 1; }
    environment:
      ADMIN_ACCESS_KEY: vexa-access-key
      ADMIN_SECRET_KEY: ${VEXA_STORAGE_SECRET}
    networks: [vexainternal]
    depends_on:
      vexa-storage:
        condition: service_healthy

  vexa:
    image: vexaai/vexa-lite:${VEXA_IMAGE_TAG:-v012}
    shm_size: 2g
    mem_limit: 3g  # a bot runs Chrome; cap it so a call cannot starve other apps on the server
    env_file: .env.vexa
    environment:
      DB_HOST: vexa-db
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: postgres
      DB_PASSWORD: ${VEXA_DB_PASSWORD}
      MINIO_ENDPOINT: vexa-storage:9000
      MINIO_ACCESS_KEY: vexa-access-key
      MINIO_SECRET_KEY: ${VEXA_STORAGE_SECRET}
      MINIO_BUCKET: vexa
      MINIO_SECURE: "false"
      VEXA_PUBLIC_API_URL: http://localhost:18056
      TERMINAL_PUBLIC_URL: http://localhost:3001
    ports:
      - "127.0.0.1:18056:8056"  # operator checks from the server only; the app uses vexa:8056
    networks: [default, vexainternal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8056/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      vexa-db:
        condition: service_healthy
      vexa-storage-init:
        condition: service_completed_successfully

  # Widens Vexa's transcriptions.language column (see deploy/vexa-schema-fix.sh). Runs once per
  # `up`, waits for Vexa to create the table, and does nothing when the column is already wide.
  # Nothing depends on it, so a failure shows in `docker compose ps -a` without stopping a deploy.
  vexa-schema-fix:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/vexa-schema-fix.sh"]
    environment:
      PGHOST: vexa-db
      PGUSER: postgres
      PGPASSWORD: ${VEXA_DB_PASSWORD}
      PGDATABASE: vexa
    volumes:
      - ./deploy/vexa-schema-fix.sh:/vexa-schema-fix.sh:ro
    networks: [vexainternal]
    restart: "no"
    depends_on:
      vexa-db:
        condition: service_healthy

# Four networks, so a compromised bot (Chrome on untrusted meeting pages) cannot reach the app's
# database: `default` carries web, worker and vexa and has internet access; `appdb` (no internet)
# holds the app database; `vexainternal` (no internet) holds Vexa's own database and storage;
# `front` holds only `next` and `web` so Vexa cannot resolve `next` by name. It is NOT a security
# boundary: Docker still lets other containers reach `next`'s published port by IP.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  front:
    ipam:
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1
  appdb:
    internal: true
  vexainternal:
    internal: true

volumes:
  dbdata:
  audiodata:
  vexapgdata:
  vexastorage:
