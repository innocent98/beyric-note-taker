[project]
name = "beyric-note-taker"
version = "0.1.0"
description = "Personal meeting-notes app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # 1.10 builds request.url from the Host header safely; the guard reads the scope path anyway.
    "starlette>=1.10",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    # 2.50 is the first release whose transcription call takes `keywords`.
    "openai>=2.50",
    "markdown-it-py>=3.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# ruff is pinned exactly so local runs and CI lint and format identically.
dev = ["pytest>=8", "pytest-httpx>=0.35", "ruff==0.17.3"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# test_api.py reuses test_web.py's fixtures by importing them, so its tests "redefine" them.
"tests/test_api.py" = ["F811"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
