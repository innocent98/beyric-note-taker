[project]
name = "beyric-note-taker"
version = "0.1.0"
description = "Personal meeting-notes app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "openai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.35", "ruff>=0.8"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
