name: deploy

# Runs after `ci` finishes on a push to main, and deploys that exact commit when CI passed.
# workflow_run always uses this file as it is on main, the default branch.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # The server's docker build alone takes about 19 minutes, so 20 cancelled every deploy at this
    # step while the server went on. GitHub must wait for the real end: the SSH client stays attached
    # until deploy.sh prints `deployed <sha>` (or fails). See docs/sop/2026-11-19-deploy-step-timeout.md.
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command on the server is deploy/deploy.sh; the SHA is its only input.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" "$SHA"
