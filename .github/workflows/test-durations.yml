name: test-durations

# Regenerates `.test_durations`, the timings `ci.yml` uses to split the Python suite into 4 even
# shards. Run it by hand (Actions, test-durations, Run workflow) after adding or removing many
# tests or after the shards drift apart, then download the `test-durations` artifact, commit it
# as `.test_durations` at the repo root and open a PR. It runs the whole suite in one job
# (serial, the only way to get clean per-test timings), so it takes about as long as the old CI.
# It never gates anything. See docs/sop/2026-11-04-ci-sharding.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway container reached only from this job: no password to write down.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: notetaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/notetaker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: ./.github/actions/system-deps
      - run: pip install -e '.[dev]'
      # --clean-durations drops entries for tests that no longer exist.
      - run: pytest -q --store-durations --clean-durations --durations-path .test_durations
      - uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: .test_durations
          # The file name starts with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
