# nginx site for Beyric Note Taker, laid out like the other sites on the server:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/beyric-notes
#   sudo ln -s /etc/nginx/sites-available/beyric-notes /etc/nginx/sites-enabled/beyric-notes
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d notes.beyrictech.com
# certbot then adds `listen 443 ssl`, the certificate lines and an HTTP-to-HTTPS redirect to this
# file ("# managed by Certbot"). Everything below stays in the HTTPS server block.
#
# sites-enabled files share `http {}` with every other site, so the zone names are prefixed and
# limit_req_status and the real-IP settings sit inside this server block, not at http level.

# Rate limiting ---------------------------------------------------------------------------
# Only POST /login is keyed; an empty key is not counted, so page views of /login are free.
map $request_method $notes_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $notes_login_key      zone=notes_login:1m   rate=6r/m;
limit_req_zone $binary_remote_addr   zone=notes_general:5m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name notes.beyrictech.com;

    # Cloudflare proxies this name, so connections arrive from Cloudflare's addresses. Trust
    # CF-Connecting-IP only from those ranges (https://www.cloudflare.com/ips, checked
    # 2026-11-02); after this $remote_addr is the visitor's address, which the rate limits and
    # the app's login limit key on. A request sent straight to the server's IP keeps its own
    # address, so the header cannot be spoofed from outside Cloudflare.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Headers the app does not set itself. The app already sends Content-Security-Policy,
    # X-Content-Type-Options, Referrer-Policy and Cache-Control, so they are NOT repeated
    # here (a second copy would be sent as a duplicate header, and a second CSP can only
    # tighten the first and could silently break pages).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    server_tokens off;
    client_max_body_size 1m;       # the app only takes small forms
    limit_req zone=notes_general burst=40 nodelay;
    limit_req_status 429;

    # Proxy headers, inherited by every location below (they set none of their own).
    # X-Forwarded-For is SET to the visitor's address, never appended with
    # $proxy_add_x_forwarded_for, so a client-supplied X-Forwarded-For is discarded and
    # cannot spoof the address the app uses for its login limit.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_redirect off;

    # Login: 6 password attempts a minute per address at the edge, on top of the app's own
    # 5-in-15-minutes counter. This also covers the JSON API's login, POST /api/session (GET is
    # not counted: the key is empty for it). The optional trailing slash matters: the Next.js
    # front door drops it before proxying, so POST /login/ reaches the app as POST /login and
    # must be counted here too, not fall through to `location /`. deploy/nginx-limit-check.sh
    # proves it.
    location ~ ^/(login|api/session)/?$ {
        limit_req zone=notes_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8020;
    }

    # Rewriting notes calls OpenAI inside the request and can take minutes (the app allows each
    # call up to 300 s), so this route may wait longer than the 60 s default above. Cloudflare
    # gives up after 100 s on its free plan and shows its own timeout page (524); the rewrite is
    # then likely, but not verified, to finish on the server, so reload the meeting page.
    location ~ ^/(api/)?meetings/[0-9]+/regenerate/?$ {
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8020;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
    }
}
