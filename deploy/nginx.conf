# ---- Rate limit zones ----
map $request_method $notes_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $notes_login_key      zone=notes_login:1m   rate=6r/m;
limit_req_zone $binary_remote_addr   zone=notes_general:5m rate=20r/s;
limit_req_zone $binary_remote_addr   zone=notes_api_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr   zone=notes_waitlist:1m rate=5r/m;
limit_req_zone $binary_remote_addr   zone=notes_import:1m   rate=20r/m;

# ---- Site ----
server {
    listen 80;
    listen [::]:80;
    server_name notes.beyrictech.com;

    # ---- Real visitor address (Cloudflare) ----
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ---- Headers and limits ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    server_tokens off;
    client_max_body_size 1m;
    limit_req zone=notes_general burst=40 nodelay;
    limit_req_status 429;

    # ---- Proxy headers ----
    include /etc/nginx/snippets/beyric-edge-secret.conf;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_redirect off;

    # ---- Routes ----
    location ~ ^/(login|api/session)/?$ {
        limit_req zone=notes_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8020;
    }

    location ~ ^/api/(signup|signup/resend|verify-email|password/forgot|password/reset|auth/google/start|team/invites/preview|mail/opt-out)/?$ {
        limit_req zone=notes_api_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8020;
    }

    location ~ ^/api/waitlist/?$ {
        limit_req zone=notes_waitlist burst=5 nodelay;
        proxy_pass http://127.0.0.1:8020;
    }

    # Importing a Word or PDF file into the team brief: the one route that takes a file upload, so
    # the one place the 1 MB default is raised (the app caps the file itself, IMPORT_MAX_BYTES, 5 MB
    # by default, and the multipart envelope needs a little more). Not buffered to a temporary file
    # at the edge: the app reads the upload in memory and the file is never written anywhere.
    location ~ ^/api/briefs/import/?$ {
        client_max_body_size 6m;
        proxy_request_buffering off;
        limit_req zone=notes_import burst=5 nodelay;
        proxy_pass http://127.0.0.1:8020;
    }

    location ~ ^/(api/)?meetings/[0-9]+/regenerate/?$ {
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8020;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
    }
}
