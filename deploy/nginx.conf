# nginx site for Beyric Note Taker. Runs on the HOST (not in Docker) so certbot stays simple.
# Install as /etc/nginx/conf.d/beyric-notes.conf (conf.d is included inside `http {}`, which
# is where limit_req_zone must live). Replace notes.example.com everywhere (two server names,
# two certificate paths). See deploy/README.md for the order of steps.

# Rate limiting ---------------------------------------------------------------------------
# Only POST /login is keyed; an empty key is not counted, so page views of /login are free.
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key      zone=login:1m   rate=6r/m;
limit_req_zone $binary_remote_addr   zone=general:5m rate=20r/s;
limit_req_status 429;

# HTTP: ACME challenges, then redirect everything else -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS ----------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notes.example.com;

    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers the app does not set itself. The app already sends Content-Security-Policy,
    # X-Content-Type-Options, Referrer-Policy and Cache-Control, so they are NOT repeated
    # here (a second copy would be sent as a duplicate header, and a second CSP can only
    # tighten the first and could silently break pages).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    server_tokens off;
    client_max_body_size 1m;       # the app only takes small forms
    limit_req zone=general burst=40 nodelay;

    # Proxy headers, inherited by both locations below (they set none of their own).
    # X-Forwarded-For is SET to the connecting address, never appended with
    # $proxy_add_x_forwarded_for, so a client-supplied X-Forwarded-For is discarded and
    # cannot spoof the address the app uses for its login limit.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_redirect off;

    # Login: 6 password attempts a minute per address at the edge, on top of the app's own
    # 5-in-15-minutes counter.
    location = /login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Rewriting notes calls OpenAI and can take minutes (the app allows each call up to 300 s),
    # so this one route may wait longer than the 60 s default above.
    location ~ ^/meetings/[0-9]+/regenerate$ {
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
